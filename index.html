.broj,.v,.pr{font-variant-numeric:tabular-nums}
.mu{color:var(--muted)} .zel{color:var(--zelena)} .gore{color:var(--zelena)} .dolje{color:var(--crvena)}
code{background:var(--kart2);padding:1px 6px;border-radius:5px;font-size:12.5px}

/* ---------- bočni izbornik ---------- */
#bok{width:var(--bok);flex:none;min-height:100vh;position:sticky;top:0;align-self:flex-start;
  background:var(--kart);border-right:1px solid var(--crta);display:flex;flex-direction:column;padding:16px 12px;gap:12px}
.logo{padding:4px 8px 2px}
.logo img{max-width:150px;max-height:46px;display:block}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--text2);font-size:14.5px;font-weight:520}
#nav a svg{width:19px;height:19px;flex:none}
#nav a:hover{background:var(--kart2)}
#nav a.on{background:var(--plava);color:#fff;font-weight:580}
.nav-sec{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:650;padding:14px 12px 4px}
.bok-dno{display:flex;gap:6px}
.bok-dno .btn{flex:1;justify-content:center}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:7px 12px;
  background:var(--kart2);border-radius:10px}
.sync svg{width:15px;height:15px;flex:none}
.sync.ok svg{color:var(--zelena)} .sync.err{color:var(--crvena)} .sync.busy svg{animation:vrt 1.1s linear infinite}
@keyframes vrt{to{transform:rotate(360deg)}}

#glavno{flex:1;min-width:0;padding:22px 26px 40px}

/* ---------- osnovno ---------- */
.kart{background:var(--kart);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--crta);border-radius:var(--r);box-shadow:var(--sjena)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:2px 0 0;font-size:30px;font-weight:700;letter-spacing:-1px}
.ph p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.eyebrow{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:650}
.akcije{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;background:var(--kart);
  border:1px solid var(--crta);font-size:13.5px;font-weight:550}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--kart2)}
.btn.pri{background:var(--plava);border-color:var(--plava);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--crvena)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.sirok{width:100%;justify-content:center;padding:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--kart2);border:1px solid var(--crta);border-radius:11px;padding:3px;gap:2px}
.seg button{border-radius:8px;padding:6px 13px;font-size:13px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--plava);color:#fff}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ib svg{width:17px;height:17px}
.pill{display:inline-block;font-size:11px;font-weight:620;padding:3px 9px;border-radius:7px;background:var(--kart2);color:var(--muted)}
.pill.ok{background:rgba(52,199,89,.16);color:var(--zelena)}
.pill.plan{background:rgba(255,149,0,.16);color:var(--naran)}

.mreza{display:grid;gap:14px;margin-bottom:14px}
.mreza.g21{grid-template-columns:1.25fr 1fr}
.stup{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- pokazatelji ---------- */
.kpi-red{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px}
.kpi .lbl{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:650}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-1.1px;margin-top:3px}
.kpi.glavni .v{font-size:40px;letter-spacing:-1.8px}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- karta ---------- */
.karta-kart{position:relative;overflow:hidden;background:var(--more);min-height:520px}
svg.karta{position:absolute;inset:0;width:100%;height:100%}
.sus{fill:var(--kopno2);stroke:var(--rub-sus);stroke-width:1;vector-effect:non-scaling-stroke}
.hr{fill:var(--kopno);stroke:var(--rub-hr);stroke-width:1.8;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin.prig{opacity:.26}
.pin text{fill:#06230f;font-weight:750;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.plan text{fill:#6b7078}
.pin text.ime{font-size:19px;font-weight:650;fill:#1c1c1e;stroke:#eceef2;stroke-width:4.5px;paint-order:stroke}
.pin text.danas{font-size:14px;font-weight:750;fill:var(--crvena);stroke:#eceef2;stroke-width:4px;paint-order:stroke}
.karta-h{position:absolute;left:18px;top:16px;z-index:5;pointer-events:none;
  background:var(--kart);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--crta);border-radius:15px;padding:11px 15px;box-shadow:var(--sjena)}
.karta-h .veliki{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1.15}
.karta-h .veliki span{color:var(--naran)}
.karta-h .sub{font-size:12px;color:var(--muted)}
.legenda{position:absolute;left:18px;bottom:16px;z-index:5;padding:10px 12px;border-radius:12px;font-size:11.5px}
.legenda b{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.legenda .ramp{display:flex;gap:3px;margin-bottom:5px}
.legenda .ramp i{width:26px;height:9px;border-radius:2px}
.legenda .d{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--text2)}
.legenda .d i{width:11px;height:11px;border-radius:50%;flex:none;background:transparent;border:1.5px dashed var(--muted)}
.legenda .d i.puna{background:var(--s3);border:0}
.ponisti{position:absolute;right:16px;top:16px;z-index:6;box-shadow:var(--sjena)}
.karta-note{position:absolute;right:16px;bottom:16px;z-index:5;font-size:11.5px;color:var(--text2);
  background:var(--kart);backdrop-filter:blur(20px);border:1px solid var(--crta);border-radius:11px;padding:7px 11px}
.karta-note a{color:var(--plava)}
#pop{position:absolute;z-index:20;width:238px;padding:13px 15px;border-radius:15px;display:none}
#pop.on{display:block}
#pop h3{margin:0;font-size:14.5px;font-weight:640}
#pop .adr{font-size:11.5px;color:var(--muted);margin:1px 0 9px}
#pop .veliko{font-size:24px;font-weight:700;letter-spacing:-.8px;margin-bottom:9px;color:var(--zelena)}
#pop dl{margin:0;display:grid;grid-template-columns:auto auto;gap:5px 10px;font-size:12px}
#pop dt{color:var(--muted)} #pop dd{margin:0;text-align:right;font-weight:580}

/* ---------- odjeljci ---------- */
.sek{padding:14px 18px 11px;border-bottom:1px solid var(--crta);display:flex;align-items:baseline;gap:9px}
.sek h2{margin:0;font-size:15px;font-weight:640}
.sek span{font-size:12px;color:var(--muted)}
.popis{padding:6px 8px 10px}
.red{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px}
.red:hover{background:var(--kart2)}
.red .t{flex:1;min-width:0}
.red .t b{display:block;font-size:13.8px;font-weight:580}
.red .t span{font-size:12px;color:var(--muted)}
.red .r{text-align:right;font-weight:620;font-size:13.8px}
.red .r .gr{font-size:11px;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:4px;background:var(--kart2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--s3)}
.bar.mini{height:5px;margin-top:5px}
.tocka{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;flex:none}

/* ---------- gradovi ---------- */
.gradovi{padding:7px 9px 10px;display:flex;flex-direction:column;gap:2px}
.grad{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:11px;padding:8px 9px;border-radius:12px;cursor:pointer}
.grad:hover{background:var(--kart2)}
.grad.on{background:rgba(0,122,255,.14)}
.grad .ime{display:flex;align-items:center;gap:8px;min-width:0}
.grad .ime i{width:9px;height:9px;border-radius:50%;flex:none}
.grad .ime b{font-size:13.2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.grad .n{font-size:11px;color:var(--muted)}
.grad .pr{text-align:right;font-weight:650;font-size:13.5px}
.grad .ud{font-size:11.5px;color:var(--muted);font-weight:500}

/* ---------- tablice ---------- */
.tbl-om{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--kart);color:var(--muted);font-size:10px;letter-spacing:.7px;text-transform:uppercase;
  font-weight:650;text-align:right;padding:9px 10px;border-bottom:1px solid var(--crta);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:18px}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05)}
:root[data-tema="light"] td{border-bottom:1px solid rgba(0,0,0,.05)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--kart2)}
tbody tr.on{background:rgba(0,122,255,.14)}
td.oz{font-weight:620;white-space:nowrap}
td .gr{color:var(--muted);font-size:11.5px}
td .mjesto{display:flex;align-items:center;gap:9px}
td .mjesto i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:3px;align-self:flex-start}
tfoot td{border-top:1px solid var(--crta);border-bottom:0;font-weight:680;background:var(--kart)}
.m-only{display:none}

/* ---------- graf ---------- */
.graf-kart{margin-bottom:14px}
.graf{height:132px;display:flex;align-items:flex-end;gap:3px;padding:14px 18px 0;position:relative}
.graf i{flex:1;display:flex;align-items:flex-end;height:100%;cursor:default}
.graf i u{display:block;width:100%;background:var(--s3);border-radius:4px 4px 0 0;min-height:2px;transition:opacity .12s}
.graf i:hover u,.graf i.on u{opacity:.65}
.graf svg.trend{position:absolute;inset:14px 18px 0;width:calc(100% - 36px);height:calc(100% - 14px);pointer-events:none;overflow:visible}
.graf svg.trend path{fill:none;stroke:var(--crvena);stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.osx{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);padding:7px 18px 14px}
.osx .tr{display:flex;align-items:center;gap:6px;font-size:11.5px}
.osx .tr em{width:16px;height:0;border-top:2px dashed var(--crvena);font-style:normal}

/* ---------- prazno, napomene ---------- */
.prazno{padding:28px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.prazno svg{width:28px;height:28px;display:block;margin:0 auto 10px;opacity:.5}
.prazno.veliko{display:flex;flex-direction:column;align-items:center;gap:8px;padding:50px 20px;
  background:var(--kart);border:1px solid var(--crta);border-radius:var(--r);margin-bottom:14px}
.prazno.veliko b{color:var(--text);font-size:16px}
.prazno.veliko .btn{margin-top:8px}
.napomena{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;border-radius:14px;font-size:13px;color:var(--text2);
  background:rgba(0,122,255,.1);border:1px solid rgba(0,122,255,.25);margin-bottom:14px}
.napomena svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--plava)}
.napomena.greska{background:rgba(255,59,48,.1);border-color:rgba(255,59,48,.3)}
.napomena.greska svg{color:var(--crvena)}

/* ---------- uvoz ---------- */
.drop{display:flex;flex-direction:column;align-items:center;gap:7px;margin:16px 18px;padding:34px 20px;
  border:2px dashed var(--crta);border-radius:16px;cursor:pointer;text-align:center}
.drop:hover,.drop.vuci{border-color:var(--plava);background:rgba(0,122,255,.06)}
.drop svg{width:30px;height:30px;color:var(--plava)}
.drop b{font-size:15px}
.drop span{font-size:12.5px;color:var(--muted)}
.ucitavanje{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--muted);font-size:13.5px}
.ucitavanje svg{width:18px;height:18px;animation:vrt 1.1s linear infinite}
.pregled-uvoz{padding:0 18px 18px}
.pu-vrh{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.pu-vrh .lbl{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:650}
.pu-vrh .v{font-size:19px;font-weight:680;letter-spacing:-.5px;margin-top:2px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg);border:1px solid var(--crta);border-radius:22px;box-shadow:var(--sjena);
  width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.mali{max-width:400px}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--crta)}
.m-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.4px}
.m-head .x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--kart2)}
.m-head .x svg{width:16px;height:16px}
.m-body{padding:16px 20px;overflow-y:auto;flex:1}
.m-foot{display:flex;gap:9px;align-items:center;padding:14px 20px;border-top:1px solid var(--crta)}
.sek-m{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:650;padding:12px 2px 7px}
.grp{background:var(--kart);border:1px solid var(--crta);border-radius:14px;overflow:hidden}
.fr{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--crta)}
.fr:last-child{border-bottom:0}
.fr-t{min-width:120px}
.fr-t label{font-size:13.5px;font-weight:530;display:block}
.fr-t .hint{font-size:11px;color:var(--muted)}
.fr-v{flex:1;display:flex;justify-content:flex-end}
.fr input,.fr select{background:transparent;border:0;text-align:right;font-size:14px;width:100%;outline:none;padding:4px 0}
.fr select{text-align-last:right}
.fr input::placeholder{color:var(--muted)}

/* ---------- prijava ---------- */
#prijava{min-height:100vh;display:grid;place-items:center;padding:24px}
.p-kart{width:100%;max-width:360px;background:var(--kart);border:1px solid var(--crta);border-radius:22px;
  padding:26px 22px;box-shadow:var(--sjena)}
.p-logo{display:flex;justify-content:center;margin-bottom:14px}
.p-logo img{max-width:160px;max-height:50px}
.p-kart h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.6px;text-align:center}
.p-sub{margin:2px 0 18px;font-size:13px;color:var(--muted);text-align:center}
.p-msg{background:rgba(255,149,0,.12);border:1px solid rgba(255,149,0,.3);border-radius:11px;
  padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.p-kart .fr input{text-align:left}
.p-err{color:var(--crvena);font-size:12.5px;min-height:18px;padding:8px 2px 2px}

/* ---------- logo kutija ---------- */
.logo-box{display:grid;place-items:center;padding:20px;margin:14px 16px;background:var(--kart2);border-radius:14px}
.logo-box img{max-width:200px;max-height:70px}

/* ---------- poruke ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2000;display:flex;align-items:center;gap:9px;
  background:var(--kart);border:1px solid var(--crta);border-radius:13px;padding:11px 16px;font-size:13.5px;
  box-shadow:var(--sjena);backdrop-filter:blur(20px);transition:opacity .3s,transform .3s}
.toast svg{width:17px;height:17px;color:var(--zelena)}
.toast.err svg{color:var(--crvena)}
.toast.off{opacity:0;transform:translateX(-50%) translateY(8px)}
#tip{position:fixed;z-index:9000;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--kart);border:1px solid var(--crta);border-radius:10px;padding:7px 10px;font-size:12px;
  backdrop-filter:blur(20px);box-shadow:var(--sjena)}
#tip b{display:block}#tip span{display:block;color:var(--muted)}

/* ---------- donja traka (mobitel) ---------- */
.tabbar{display:none}

@media(max-width:1100px){
  .mreza.g21{grid-template-columns:1fr}
  .kpi-red{grid-template-columns:1fr 1fr}
  .karta-kart{min-height:420px}
}
@media(max-width:860px){
  body{display:block}
  #bok{display:none}
  #glavno{padding:16px 14px calc(84px + env(safe-area-inset-bottom))}
  .ph h1{font-size:24px}
  .akcije{margin-left:0;width:100%}
  .seg{flex:1} .seg button{flex:1;text-align:center;padding:7px 8px}
  .kpi-red{grid-template-columns:1fr 1fr;gap:10px}
  .kpi.glavni{grid-column:1 / -1}
  .kpi.glavni .v{font-size:34px}
  .kpi .v{font-size:21px}
  .karta-kart{min-height:46vh}
  .karta-h .veliki{font-size:21px}
  .legenda{display:none}
  .grad{grid-template-columns:1fr auto;grid-template-areas:"ime pr" "bar bar";gap:6px 10px}
  .grad .ime{grid-area:ime} .grad .bar{grid-area:bar;height:6px} .grad .pr{grid-area:pr}
  th:nth-child(n+4),td:nth-child(n+4){display:none}
  .m-only{display:block !important}
  .pu-vrh{grid-template-columns:1fr 1fr}
  .sakrij-m{display:none}
  .modal{max-height:96vh;border-radius:18px}
  .fr{flex-wrap:wrap} .fr-v{flex-basis:100%;justify-content:flex-start}
  .fr input,.fr select{text-align:left}

  .tabbar{display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;
    position:fixed;left:0;right:0;bottom:0;z-index:900;height:64px;padding-bottom:env(safe-area-inset-bottom);
    background:rgba(20,20,22,.9);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    border-top:1px solid var(--crta)}
  :root[data-tema="light"] .tabbar{background:rgba(255,255,255,.92)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
    font-size:10.5px;font-weight:550;-webkit-tap-highlight-color:transparent}
  .tabbar a svg{width:23px;height:23px}
  .tabbar a.on{color:var(--plava)}
  .fab{position:relative;top:-14px;width:60px;height:60px;border-radius:50%;background:var(--plava);
    display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,122,255,.45);justify-self:center}
  .fab svg{width:26px;height:26px;color:#fff;stroke-width:2.2}
}
@media(max-width:430px){
  .kpi.glavni .v{font-size:30px}
  .kpi .v{font-size:19px}
  .kpi .lbl{font-size:9.5px;letter-spacing:.7px}
  .pu-vrh{grid-template-columns:1fr 1fr}
}

/* ---------- lokalni način ---------- */
#lokTraka{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-radius:14px;font-size:13px;
  color:var(--text2);background:rgba(255,149,0,.12);border:1px solid rgba(255,149,0,.3);margin-bottom:16px}
#lokTraka svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--naran)}
#lokTraka b{color:var(--text)}

/* ---------- oblačić: popis aparata ---------- */
.pop-crta{height:1px;background:var(--crta);margin:10px 0 9px}
.pop-ap div{display:flex;align-items:baseline;gap:7px;font-size:12px;padding:3px 0}
.pop-ap b{font-weight:620;flex:none}
.pop-ap span{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-ap i{font-style:normal;font-weight:600;text-align:right;flex:none}
.pop-ap em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);font-weight:500}

/* ---------- ispis / PDF ---------- */
#ispis{display:none}
@media print{
  body{display:block !important;background:#fff !important;color:#000 !important}
  #bok,#glavno,.tabbar,.toast,#tip,#lokTraka,.overlay{display:none !important}
  #ispis{display:block;padding:0;font-size:11px;color:#000}
  #ispis .pz{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1.5px solid #000;padding-bottom:8px;margin-bottom:14px}
  #ispis .pn{font-size:13px;font-weight:700}
  #ispis .pm{font-size:10px;color:#555}
  #ispis .pd{font-size:10px;color:#555;text-align:right}
  #ispis h1{font-size:19px;margin:0;font-weight:700}
  #ispis h2{font-size:12px;margin:16px 0 6px;font-weight:700;border-bottom:1px solid #999;padding-bottom:3px}
  #ispis .pk{display:flex;gap:26px;margin:12px 0 4px}
  #ispis .pk span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#555}
  #ispis .pk b{font-size:16px}
  #ispis table.pt{width:100%;border-collapse:collapse;font-size:10.5px}
  #ispis .pt th{background:#eee;text-align:left;padding:4px 6px;border:1px solid #bbb;
    font-size:9px;text-transform:uppercase;letter-spacing:.5px}
  #ispis .pt td{padding:4px 6px;border:1px solid #ddd}
  #ispis .pt td.d{text-align:right}
  #ispis .pt tbody tr:nth-child(even){background:#f7f7f7}
  #ispis .pf{margin-top:18px;font-size:9px;color:#777;border-top:1px solid #ccc;padding-top:6px}
  @page{size:A4 portrait;margin:14mm}
}

/* ---------- izbornik razdoblja ---------- */
.razd{display:flex;align-items:center;gap:8px;background:var(--kart2);border:1px solid var(--crta);
  border-radius:12px;padding:4px 10px 4px 4px}
.razd .god-sel{background:var(--kart);border:1px solid var(--crta);border-radius:9px;padding:5px 8px;
  font-size:13.5px;font-weight:650;letter-spacing:-.2px;outline:none;cursor:pointer}
.razd .god-plus{width:26px;height:26px;border-radius:8px;background:var(--kart);border:1px solid var(--crta);
  font-size:16px;line-height:1;color:var(--text2);display:grid;place-items:center}
.razd .god-plus:hover{background:var(--plava);border-color:var(--plava);color:#fff}
.razd .razd-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:650;margin-left:4px}
.razd .razd-sel{background:var(--kart);border:1px solid var(--crta);border-radius:9px;padding:6px 10px;
  font-size:13.5px;font-weight:550;outline:none;cursor:pointer;min-width:170px}
@media(max-width:860px){
  .razd{width:100%;flex-wrap:wrap;padding:7px 9px}
  .razd .razd-lbl{display:none}
  .razd .razd-sel{flex:1;min-width:0}
}
#lokTraka.lose{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.35)}
#lokTraka.lose svg{color:var(--crvena)}

/* ---------- ispravak dana ---------- */
.kvac{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;cursor:pointer}
.kvac input{width:16px;height:16px;accent-color:var(--plava);cursor:pointer}
.kvac em{font-style:normal;color:var(--muted)}
.dan-grp{padding:2px 0}
.dan-red{display:grid;grid-template-columns:1fr 74px 96px 36px;align-items:center;gap:8px;
  padding:9px 13px;border-bottom:1px solid var(--crta)}
.dan-red:last-child{border-bottom:0}
.dan-red.brisan{opacity:.45;text-decoration:line-through}
.dan-n b{display:block;font-size:13.5px;font-weight:580}
.dan-n span{font-size:11px;color:var(--muted)}
.dan-red input{background:var(--kart2);border:1px solid var(--crta);border-radius:9px;
  padding:6px 9px;font-size:13.5px;text-align:right;width:100%;outline:none}
.dan-red input:focus{border-color:var(--plava)}
.dan-red .btn{padding:6px;justify-content:center}
.dan-uk{display:flex;justify-content:space-between;align-items:center;padding:13px 4px 0;font-size:13.5px}
.dan-uk span{color:var(--muted)}
.dan-uk b{font-size:15px;font-weight:680}
td.radnje{white-space:nowrap}
td.radnje .btn{padding:5px 8px;margin-left:4px}
.popis .red .btn.dan{padding:6px 9px;margin-left:8px}
@media(max-width:860px){
  .dan-red{grid-template-columns:1fr 64px 84px 34px;gap:6px;padding:9px 10px}
}
</style>

/* ---------- sitnice ---------- */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>[...(r||document).querySelectorAll(s)];
const pad = n=>String(n).padStart(2,'0');
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v=>{ if(typeof v==='number') return v; const n=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; };
const eur  = n=>new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const eur2 = n=>new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n||0);

/* ---------- mreža s vremenskim ograničenjem ---------- */
async function fetchT(url, opt={}, ms=20000){
  if(typeof AbortController==='undefined') return fetch(url, opt);
  const c=new AbortController(), t=setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, Object.assign({}, opt, {signal:c.signal})); }
  catch(e){ if(e&&e.name==='AbortError') throw new Error('Mreža ne odgovara'); throw e; }
  finally{ clearTimeout(t); }
}

async function authCall(grant, body){
  const r = await fetchT(SB_URL+'/auth/v1/token?grant_type='+grant,
    {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)}, 15000);
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){
    const m=String((j&&(j.error_description||j.msg||j.message||j.error))||'');
    if(/invalid login|invalid_grant|invalid credentials/i.test(m)) throw new Error('Pogrešan e-mail ili lozinka');
    if(/not confirmed/i.test(m)) throw new Error('E-mail adresa nije potvrđena');
    if(r.status===429) throw new Error('Previše pokušaja – pričekajte malo');
    throw new Error(m||('Greška '+r.status));
  }
  return j;
}
function authStore(j){
  AUTH = {access_token:j.access_token, refresh_token:j.refresh_token,
          expires_at:j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600),
          email:(j.user&&j.user.email)||(AUTH&&AUTH.email)||''};
  lsSet('auth', AUTH);
}
let refreshP=null;
async function authFresh(){
  if(!AUTH || !AUTH.refresh_token) return false;
  if(AUTH.expires_at-90 > Date.now()/1000) return true;
  if(!navigator.onLine) return false;
  if(!refreshP) refreshP = authCall('refresh_token',{refresh_token:AUTH.refresh_token})
    .then(j=>{ authStore(j); return true; })
    .catch(()=>{ AUTH=null; lsSet('auth',null); return false; })
    .finally(()=>{ refreshP=null; });
  return refreshP;
}

/* ---------- Supabase REST ---------- */
async function sb(put, opt={}){
  await authFresh();
  const h = Object.assign({apikey:SB_KEY, 'Content-Type':'application/json'}, opt.headers||{});
  if(AUTH && AUTH.access_token) h.Authorization = 'Bearer '+AUTH.access_token;
  const r = await fetchT(SB_URL+'/rest/v1/'+put, Object.assign({}, opt, {headers:h}));
  if(!r.ok){
    let t=''; try{ t=(await r.json()).message||''; }catch(e){}
    if(/schema cache|does not exist|relation .* does not exist/i.test(t))
      throw new Error('Baza još nije postavljena — pokrenite supabase_prodaja_v2.sql u Supabase SQL editoru, pa osvježite stranicu.');
    throw new Error(r.status===401?'Prijava je istekla – prijavite se ponovno'
                  : r.status===403?'Nemate pravo na ovu radnju'
                  : (t||('Greška '+r.status)));
  }
  if(opt.method==='DELETE' || (opt.headers&&/return=minimal/.test(opt.headers.Prefer||''))) return null;
  return r.json();
}

/* =========================================================
   Mini XLSX — prava Excel datoteka bez vanjskih biblioteka
   (ZIP bez kompresije + minimalni OOXML)
   ========================================================= */
function crc32(u8){
  let c, crc = 0xFFFFFFFF;
  if(!crc32.T){ crc32.T = new Int32Array(256);
    for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; crc32.T[n]=c; } }
  for(let i=0;i<u8.length;i++) crc = (crc>>>8) ^ crc32.T[(crc ^ u8[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  const u16 = n => [n&255,(n>>8)&255], u32 = n => [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = [].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(n),u32(n),u16(name.length),u16(0));
    parts.push(new Uint8Array(lh), name, f.data);
    cd.push({name, crc, n, off});
    off += lh.length + name.length + n;
  });
  const cdParts = []; let cdLen = 0;
  cd.forEach(e=>{
    const h = [].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(e.crc),u32(e.n),u32(e.n),
      u16(e.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.off));
    cdParts.push(new Uint8Array(h), e.name); cdLen += h.length + e.name.length;
  });
  const eocd = new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(cd.length),u16(cd.length),u32(cdLen),u32(off),u16(0)));
  return new Blob(parts.concat(cdParts,[eocd]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function xCol(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }
function xlsxBlob(naziv, rows){
  const enc = new TextEncoder();
  const sheet = rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
      const ref = xCol(ci)+(ri+1);
      return (typeof v==='number' && isFinite(v))
        ? `<c r="${ref}"><v>${v}</v></c>`
        : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xEsc(v==null?'':v)}</t></is></c>`;
    }).join('')+'</row>').join('');
  const F = [
   ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
   ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xEsc(naziv).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'],
   ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
   ['xl/worksheets/sheet1.xml','<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sheet+'</sheetData></worksheet>']
  ];
  return zipStore(F.map(([n,x])=>({name:n, data:enc.encode(x)})));
}
function saveXlsx(naziv, ime, rows){
  try{
    const blob = xlsxBlob(naziv, rows);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ime;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 600);
    poruka('Excel preuzet: '+ime);
  }catch(e){ console.error(e); poruka('Excel nije izrađen: '+(e.message||e),'err'); }
}

/* =========================================================
   Čitanje .xlsx u pregledniku — bez vanjskih biblioteka.
   ZIP se raspakira ugrađenim DecompressionStream-om.
   ========================================================= */
const MOZE_CITATI_XLSX = (typeof DecompressionStream !== 'undefined');

async function napuhni(u8){                       // deflate-raw → bajtovi
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

/* minimalni ZIP: pročitaj središnji katalog pa izvadi tražene datoteke */
async function zipOtvori(buf){
  const d = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(d.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Datoteka nije ispravan .xlsx (nedostaje ZIP zapis)');
  const n = d.getUint16(eocd + 10, true);
  let p = d.getUint32(eocd + 16, true);
  const dat = {};
  for(let i = 0; i < n; i++){
    if(d.getUint32(p, true) !== 0x02014b50) break;
    const metoda = d.getUint16(p + 10, true);
    const velKomp = d.getUint32(p + 20, true);
    const duljIme = d.getUint16(p + 28, true);
    const duljEx  = d.getUint16(p + 30, true);
    const duljKom = d.getUint16(p + 32, true);
    const odmak   = d.getUint32(p + 42, true);
    const ime = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + duljIme));
    dat[ime] = {metoda, velKomp, odmak};
    p += 46 + duljIme + duljEx + duljKom;
  }
  return {
    async tekst(ime){
      const z = dat[ime]; if(!z) return null;
      const ln = new DataView(buf, z.odmak);
      if(ln.getUint32(0, true) !== 0x04034b50) throw new Error('Oštećen ZIP zapis');
      const poc = z.odmak + 30 + ln.getUint16(26, true) + ln.getUint16(28, true);
      const sirovo = u8.subarray(poc, poc + z.velKomp);
      const bajt = z.metoda === 0 ? sirovo : await napuhni(sirovo);
      return new TextDecoder().decode(bajt);
    },
    imena: Object.keys(dat),
  };
}

const stupacBroj = r => { let n = 0; for(const c of (r.match(/^[A-Z]+/) || [''])[0]) n = n*26 + (c.charCodeAt(0)-64); return n-1; };

/* vraća polje redaka, svaki redak je polje vrijednosti (tekst ili broj) */
async function citajXlsx(buf){
  if(!MOZE_CITATI_XLSX) throw new Error('Ovaj preglednik ne zna raspakirati .xlsx — otvorite u Chromeu ili Edgeu');
  const zip = await zipOtvori(buf);
  const dp = new DOMParser();

  let niz = [];
  const ss = await zip.tekst('xl/sharedStrings.xml');
  if(ss){
    const x = dp.parseFromString(ss, 'application/xml');
    niz = [...x.getElementsByTagName('si')].map(si =>
      [...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  }
  const ime = zip.imena.find(i => /^xl\/worksheets\/sheet\d+\.xml$/.test(i));
  if(!ime) throw new Error('U datoteci nema nijednog lista');
  const x = dp.parseFromString(await zip.tekst(ime), 'application/xml');

  const red = [];
  for(const r of x.getElementsByTagName('row')){
    const linija = [];
    for(const c of r.getElementsByTagName('c')){
      const i = stupacBroj(c.getAttribute('r') || 'A1');
      const t = c.getAttribute('t');
      let v = null;
      if(t === 's'){
        const vi = c.getElementsByTagName('v')[0];
        v = vi ? (niz[+vi.textContent] ?? '') : '';
      } else if(t === 'inlineStr'){
        v = [...c.getElementsByTagName('t')].map(e => e.textContent).join('');
      } else {
        const vi = c.getElementsByTagName('v')[0];
        v = vi ? vi.textContent : null;
        if(v !== null && v !== '' && !isNaN(v)) v = parseFloat(v);
      }
      linija[i] = v;
    }
    red.push(linija);
  }
  return red;
}

   razmaknemo ih i povučemo tanku crtu do prave točke */
function razmakni(G, max){
  const t = G.map(g=>{ const k=xy(g.lat,g.lng);
    return {g, ax:k[0], ay:k[1], x:k[0], y:k[1], r:17+30*Math.sqrt(max?g.iznos/max:0)}; });
  for(let it=0; it<160; it++){
    let pomak=false;
    for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){
      const a=t[i], b=t[j];
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r+16;
      if(d<min){ if(d<0.01){dx=1;dy=0;d=1;}
        const k=(min-d)/d*0.5;
        a.x-=dx*k; a.y-=dy*k; b.x+=dx*k; b.y+=dy*k; pomak=true; }
    }
    t.forEach(o=>{ o.x+=(o.ax-o.x)*0.04; o.y+=(o.ay-o.y)*0.04; });
    if(!pomak) break;
  }
  return t;
}

/* boja po prometu po aparatu — jedan ton, četiri stupnja */
function ljestvica(vrijednosti){
  const v = vrijednosti.filter(x=>x>0).sort((a,b)=>a-b);
  if(!v.length) return [0,0,0];
  return [v[Math.floor(v.length*.25)], v[Math.floor(v.length*.5)], v[Math.floor(v.length*.75)]];
}
function bojaPo(v, q){
  const c=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
  return v<q[0]?c[0] : v<q[1]?c[1] : v<q[2]?c[2] : c[3];
}

/* ---------- grupiranje aparata po gradu ---------- */
function grupeGradova(stat){
  const g={};
  DB.aparati.forEach(a=>{
    if(a.lat==null || a.lng==null) return;            // bez koordinata se ne crta
    const k=(a.grad||'Ostalo');
    (g[k]=g[k]||{ime:k, lista:[], lat:0, lng:0, iznos:0, komada:0}).lista.push(a);
  });
  Object.values(g).forEach(x=>{
    x.lat = x.lista.reduce((s,a)=>s+a.lat,0)/x.lista.length;
    x.lng = x.lista.reduce((s,a)=>s+a.lng,0)/x.lista.length;
    x.iznos  = x.lista.reduce((s,a)=>s+((stat[a.oznaka]||{}).iznos||0),0);
    x.komada = x.lista.reduce((s,a)=>s+((stat[a.oznaka]||{}).komada||0),0);
    x.aktivnih = x.lista.filter(a=>a.status==='Aktivan').length;
    x.po = x.iznos/x.lista.length;
  });
  return Object.values(g).sort((a,b)=>b.iznos-a.iznos);
}

function kartaHtml(){

    <g id="pins"></g></svg>`;
}

let POLOZAJ = {};
function crtajPinove(stat, odabraniGrad){
  const el = $('#pins'); if(!el) return;
  const G = grupeGradova(stat);
  if(!G.length){ el.innerHTML=''; POLOZAJ={}; return; }
  const max = Math.max(...G.map(g=>g.iznos), 1);
  const q = ljestvica(DB.aparati.map(a=>(stat[a.oznaka]||{}).iznos||0));
  const T = razmakni(G, max);
  const DAN = isoDate(), danasPo = {};
  dnevni().filter(r=>r.datum===DAN).forEach(r=>{
    const a = DB.aparati.find(x=>x.oznaka===r.oznaka); if(!a) return;
    const kljuc = a.grad||'—';
    const o = danasPo[kljuc] = danasPo[kljuc] || {iznos:0, komada:0};
    o.iznos += num(r.iznos); o.komada += (+r.komada||0);
  });
  el.innerHTML = T.map(o=>{
    const g=o.g, x=o.x, y=o.y, r=o.r;
    const radi = g.iznos>0;
    const b = radi ? bojaPo(g.po, q) : '#8e8e93';
    const prig = odabraniGrad && odabraniGrad!==g.ime;
    const dx=x-o.ax, dy=y-o.ay, dl=Math.hypot(dx,dy);
    let lx=x, ly=y+r+21, la='middle';
    if(dl>4){ const ux=dx/dl, uy=dy/dl;
      lx=x+ux*(r+14); ly=y+uy*(r+14);
      la = ux>0.4?'start' : ux<-0.4?'end' : 'middle';
      if(Math.abs(ux)<=0.4) ly = y + (uy>0 ? r+21 : -r-19);
    }
    return `<g class="pin${radi?'':' plan'}${prig?' prig':''}" data-g="${esc(g.ime)}">
      ${dl>r*0.35?`<line x1="${o.ax}" y1="${o.ay}" x2="${x}" y2="${y}" stroke="${b}" stroke-width="1.4" opacity=".6" vector-effect="non-scaling-stroke"/>
        <circle cx="${o.ax}" cy="${o.ay}" r="3.5" fill="${b}" opacity=".9"/>`:''}
      <circle cx="${x}" cy="${y}" r="${r}" fill="${radi?b:'none'}"
        stroke="${radi?'rgba(255,255,255,.75)':'#8e8e93'}" stroke-width="${radi?2:1.6}"
        ${radi?'':'stroke-dasharray="4 3"'} vector-effect="non-scaling-stroke"/>
      <text x="${x}" y="${y}" style="font-size:${Math.round(r*.8)}px">${g.lista.length}</text>
      ${radi ? (()=>{ const d=danasPo[g.ime]||{iznos:0,komada:0};
          const gore = ly>y;
          return `<text class="danas" x="${x}" y="${gore ? y-r-11 : y+r+13}">${d.komada} · ${eur2(d.iznos)}</text>`;
        })() : ''}
      <text class="ime" x="${lx}" y="${ly}" text-anchor="${la}" dominant-baseline="central">${esc(g.ime)}</text></g>`;
  }).join('');
  POLOZAJ={}; T.forEach(o=>POLOZAJ[o.g.ime]=[o.x,o.y]);
}

/* oblačić uz mjehurić */
function oblacic(el, grad){
  const tocka = POLOZAJ[grad]; if(!tocka) return;
  const sv=$('#svgKarta'); if(!sv) return;
  const rc=sv.getBoundingClientRect(), vb=sv.viewBox.baseVal;
  const k=Math.min(rc.width/vb.width, rc.height/vb.height);
  const px=rc.width/2+(tocka[0]-vb.width/2)*k, py=rc.height/2+(tocka[1]-vb.height/2)*k;
  el.classList.add('on');
  const w=el.offsetWidth, h=el.offsetHeight;
  el.style.left=Math.max(8, Math.min(px+24, rc.width-w-8))+'px';
  el.style.top =Math.max(8, Math.min(py-h/2, rc.height-h-8))+'px';
}

/* ---------- razdoblje ---------- */
const MJN = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj',
             'Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const zadnjiDan = (g,m)=> new Date(g, m, 0).getDate();     // m je 1–12

function perRaspon(){
  const t = isoDate();
  if(RAZD==='dan') return {od:t, do:t};
  if(RAZD==='sve') return {od:'0000-01-01', do:'9999-12-31'};
  if(RAZD==='god') return {od:GOD+'-01-01', do:GOD+'-12-31'};
  const m = +RAZD;
  return {od:GOD+'-'+pad(m)+'-01', do:GOD+'-'+pad(m)+'-'+pad(zadnjiDan(GOD,m))};
}
function perNaziv(){
  if(RAZD==='dan') return 'danas';
  if(RAZD==='sve') return 'ukupno';
  if(RAZD==='god') return 'godina '+GOD+'.';
  return MJN[+RAZD-1].toLowerCase()+' '+GOD+'.';
}
function perOznaka(){                       // za nazive datoteka
  if(RAZD==='dan') return isoDate();
  if(RAZD==='sve') return 'ukupno';
  if(RAZD==='god') return String(GOD);
  return GOD+'-'+RAZD;
}
/* broj dana u razdoblju, ali nikad u budućnost */
const perDana = ()=>{
  const r = perRaspon(), t = isoDate();
  let od = r.od, dok = r.do > t ? t : r.do;
  if(RAZD==='sve'){
    const sv = DB.prodaja.map(x=>x.datum).filter(Boolean);
    od = sv.length ? sv.reduce((a,b)=>a<b?a:b) : t;
  }
  if(dok < od) return 1;
  return Math.max(1, Math.min(Math.round((new Date(dok)-new Date(od))/86400000)+1, 3700));
};
/* godine koje nudimo u izborniku */
function godine(){
  const sk = DB.prodaja.map(r=>+String(r.datum||'').slice(0,4)).filter(g=>g>2000);
  const dod = lsGet('godineDod', []);
  const sve = new Set([...sk, ...dod, new Date().getFullYear(), GOD]);
  return [...sve].sort((a,b)=>b-a);
}
function dodajGodinu(){
  const g = Math.max(...godine()) + 1;
  const dod = lsGet('godineDod', []);
  if(!dod.includes(g)){ dod.push(g); lsSet('godineDod', dod); }
  GOD = g; lsSet('god', g); RAZD='god'; lsSet('razd','god'); crtaj();
  poruka('Dodana godina '+g+'.');
}
/* postoji li prodaja u nekom drugom razdoblju — uputa kad je prazno */
function drugdjeIma(){
  if(!DB.prodaja.length) return null;
  if(ukupno().iznos > 0) return null;
  const sg = GOD, sr = RAZD;
  const kandidati = [{g:sg, r:'god', n:'Cijela godina '+sg+'.'}, {g:sg, r:'sve', n:'Sve'}];
  godine().forEach(g=>{ if(g!==sg) kandidati.push({g, r:'god', n:'Cijela godina '+g+'.'}); });
  for(const k of kandidati){
    GOD=k.g; RAZD=k.r; const v=ukupno().iznos; GOD=sg; RAZD=sr;
    if(v>0) return {god:k.g, razd:k.r, naziv:k.n, iznos:v};
  }
  return null;
}
function postaviRazdoblje(g, r){
  GOD = +g; RAZD = r; lsSet('god', GOD); lsSet('razd', RAZD); crtaj();
}

/* ---------- izračuni ---------- */
const dnevni = ()=> DB.prodaja.filter(r=>!r.razdoblje);
const razdobljaUk = ()=> DB.prodaja.filter(r=>r.razdoblje)
  .reduce((s,r)=>({iznos:s.iznos+num(r.iznos), komada:s.komada+(+r.komada||0)}), {iznos:0,komada:0});

/* Zbirni uvoz (npr. cijela godina odjednom) ulazi u razdoblje samo ako cijeli
   stane u njega — tako 10 mjeseci odjednom ne upadne u siječanj. */
function uRazdoblju(r, R){
  if(!r.razdoblje) return r.datum >= R.od && r.datum <= R.do;
  return r.datum >= R.od && (r.do_datuma || r.datum) <= R.do;
}
function redci(){
  const R = perRaspon();
  return DB.prodaja.filter(r=>uRazdoblju(r, R)
    && (!ODABA || r.oznaka===ODABA)
    && (!ODABG || (DB.aparati.find(a=>a.oznaka===r.oznaka)||{}).grad===ODABG));
}
function poAparatu(){
  const st={};
  redci().forEach(r=>{ const o=st[r.oznaka]=st[r.oznaka]||{iznos:0,komada:0};
    o.iznos+=num(r.iznos); o.komada+=(+r.komada||0); });
  return st;
}
function poProizvodu(){
  const st={};
  redci().forEach(r=>{ const o=st[r.proizvod]=st[r.proizvod]||{iznos:0,komada:0};
    o.iznos+=num(r.iznos); o.komada+=(+r.komada||0); });
  return Object.entries(st).map(([p,v])=>({proizvod:p, ...v})).sort((a,b)=>b.iznos-a.iznos);
}
/* graf uvijek pokazuje zadnjih 30 dana, bez obzira na odabrano razdoblje —
   poštuje samo odabrani grad ili aparat */
function poDanu(dana){
  const kraj=isoDate(), mapa={};
  dnevni().filter(r=>(!ODABA || r.oznaka===ODABA)
      && (!ODABG || (DB.aparati.find(a=>a.oznaka===r.oznaka)||{}).grad===ODABG))
    .forEach(r=>{ const o=mapa[r.datum]=mapa[r.datum]||{iznos:0,komada:0};
      o.iznos+=num(r.iznos); o.komada+=(+r.komada||0); });
  const niz=[];
  for(let i=dana-1;i>=0;i--){ const d=addDays(kraj,-i), o=mapa[d]||{iznos:0,komada:0};
    niz.push({datum:d, iznos:o.iznos, komada:o.komada}); }
  return niz;
}
const ukupno = ()=>{ const s=redci().reduce((a,r)=>({iznos:a.iznos+num(r.iznos), komada:a.komada+(+r.komada||0)}),{iznos:0,komada:0}); return s; };
const aparat = o=>DB.aparati.find(a=>a.oznaka===o)||{};

const OKUS_REZERVA = ['#5e9cff','#af52de','#32ade6','#ff2d55','#30b0c7','#ffd60a','#66d19e','#ff6b35'];
function bojaOkusa(ime){
  const t = String(ime||'');
  for(const [re,b] of OKUS_BOJE) if(re.test(t)) return b;
  let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  return OKUS_REZERVA[h%OKUS_REZERVA.length];
}

/* ---------- graf po danima ---------- */
function klizni(t,w){ const h=Math.floor(w/2), o=[];
  for(let i=0;i<t.length;i++){ const a=Math.max(0,i-h), b=Math.min(t.length-1,i+h);
    let z=0; for(let j=a;j<=b;j++) z+=t[j]; o.push(z/(b-a+1)); } return o; }
function krivulja(v,max,n){
  const pt=v.map((y,i)=>[ (i+0.5)/n*100, 100-100*y/(max||1) ]);
  let d='M'+pt[0][0].toFixed(2)+' '+pt[0][1].toFixed(2);
  for(let i=0;i<pt.length-1;i++){
    const p0=pt[i-1]||pt[i], p1=pt[i], p2=pt[i+1], p3=pt[i+2]||pt[i+1];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+='C'+c1[0].toFixed(2)+' '+c1[1].toFixed(2)+','+c2[0].toFixed(2)+' '+c2[1].toFixed(2)+','+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
  }
  return d;
}
function crtajGraf(){
  const el=$('#graf'); if(!el) return;
  const niz=poDanu(30), v=niz.map(x=>x.iznos), max=Math.max(...v,1);
  el.innerHTML = niz.map(x=>`<i data-t="${fDate(x.datum)}" data-v="${eur2(x.iznos)}" data-k="${x.komada}"><u style="height:${Math.max(3,100*x.iznos/max)}%"></u></i>`).join('')
    + `<svg class="trend" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${krivulja(klizni(v,7),max,v.length)}"/></svg>`;
  /* oblačić: stupac se računa iz vodoravnog položaja miša, pa ne ovisi
     o tome na koji je točno element pokazivač ušao */
  const pad=18;
  el.onpointerleave = ()=>{ tipSakrij(); el.querySelectorAll('i.on').forEach(b=>b.classList.remove('on')); };
  el.onpointermove = e=>{
    const r=el.getBoundingClientRect();
    const sir=(r.width-2*pad)/niz.length;
    let i=Math.floor((e.clientX-r.left-pad)/sir);
    i=Math.max(0, Math.min(niz.length-1, i));
    const x=niz[i];
    tipPrikazi(`<b>${eur2(x.iznos)}</b><span>${brj(x.komada)} ${mn(x.komada,'napitak','napitka','napitaka')}</span><span>${fDate(x.datum)}</span>`,
               e.clientX, e.clientY);
    el.querySelectorAll('i').forEach((b,j)=>b.classList.toggle('on', j===i));
  };

  $('#g1').textContent = fDate(niz[0].datum).slice(0,6);
  const z=v.slice(-7).reduce((a,b)=>a+b,0)/7, r=v.slice(-14,-7).reduce((a,b)=>a+b,0)/7;
  const p=r?Math.round(100*(z-r)/r):0;
  $('#gtr').innerHTML = p>0?`<span class="gore">▲ ${p} %</span>` : p<0?`<span class="dolje">▼ ${Math.abs(p)} %</span>` : '<span class="mu">—</span>';
}

/* razlaganje izvoza s platforme */
function razlozi(red, naziv){
  const nadji = t => red.findIndex(r=>String(r[0]||'').trim().toLowerCase()===t);
  const iz = nadji('goods name');
  if(iz<0) throw new Error('Ne prepoznajem oblik — očekujem stupac „Goods Name”.');
  let od=null, doDat=null;
  const ir = nadji('start time');
  if(ir>=0 && red[ir+1]){ od=String(red[ir+1][0]||'').slice(0,10); doDat=String(red[ir+1][1]||'').slice(0,10); }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(od||'')) throw new Error('Ne prepoznajem razdoblje („Start Time”).');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(doDat||'')) doDat=od;

  const stavke=[];
  for(let i=iz+1;i<red.length;i++){
    const r=red[i]; if(!r||!r[0]) continue;
    const kom=+r[4]||0, izn=num(r[5]);
    if(!kom && !izn) continue;
    stavke.push({proizvod:String(r[0]).trim(), uredjaj:String(r[1]||'').trim(), komada:kom, iznos:izn});
  }
  if(!stavke.length) throw new Error('U datoteci nema nijedne stavke s prodajom.');

  const uredjaji = [...new Set(stavke.map(s=>s.uredjaj))];
  const veza = {}; uredjaji.forEach(u=>{ const a=DB.aparati.find(x=>(x.uredjaj||'')===u); if(a) veza[u]=a.oznaka; });
  const nepoznati = uredjaji.filter(u=>!veza[u]);
  const razdoblje = od!==doDat;
  const sudarDani = razdoblje ? [...new Set(dnevni().filter(r=>r.datum>=od && r.datum<=doDat).map(r=>r.datum))].sort() : [];

  return {naziv, od, do:doDat, razdoblje, stavke, uredjaji, veza, nepoznati, sudarDani,
          komada:stavke.reduce((s,x)=>s+x.komada,0),
          iznos:stavke.reduce((s,x)=>s+x.iznos,0)};
}

async function spremiUvoz(){
  const u=UVOZ; if(!u) return;
  if(!jeAdmin()){ poruka('Samo vlasnik smije uvoziti','err'); return; }
  try{
    stanje('busy','Spremanje…');
    const uvozId = uid();
    const redci = u.stavke.map(s=>({
      id: uid(), datum:u.od, oznaka:u.veza[s.uredjaj], uredjaj:s.uredjaj,
      proizvod:s.proizvod, komada:s.komada, iznos:+s.iznos.toFixed(2),
      razdoblje:u.razdoblje, do_datuma: u.razdoblje?u.do:null,
      uvoz_id: uvozId, updated_at: new Date().toISOString()}));
    // zamijeni postojeće retke istog dana (ili istog zbirnog razdoblja)
    await sb('pn_prodaja?datum=eq.'+u.od+'&razdoblje=is.'+(u.razdoblje?'true':'false'),
             {method:'DELETE', headers:{Prefer:'return=minimal'}});
    // zbirni uvoz: po želji makni dnevne unose koji padaju u isto razdoblje
    if(u.razdoblje && u.sudarDani.length && $('#brisiDane') && $('#brisiDane').checked){
      await sb('pn_prodaja?datum=gte.'+u.od+'&datum=lte.'+u.do+'&razdoblje=is.false',
               {method:'DELETE', headers:{Prefer:'return=minimal'}});
    }
    for(let i=0;i<redci.length;i+=500){
      await sb('pn_prodaja', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
                              body:JSON.stringify(redci.slice(i,i+500))});
    }
    await sb('pn_uvoz', {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify([{
      id:uvozId, od:u.od, do_dat:u.do, redaka:u.stavke.length, komada:u.komada,
      iznos:+u.iznos.toFixed(2), datoteka:u.naziv, korisnik:AUTH.email, razdoblje:u.razdoblje,
      kada:new Date().toISOString()}])});
    UVOZ=null;
    await ucitaj(true);
    poruka('Uvezeno — '+brj(u.komada)+' napitaka, '+eur2(u.iznos));
    idi('pregled');
  }catch(e){
    stanje('err', e.message||'Greška');
    poruka(e.message||'Spremanje nije uspjelo','err');
  }
}

function urediAparat(oznaka){
  const novi = !oznaka;
  const rec = novi ? {oznaka:'', uredjaj:'', naziv:'', prostor:'', adresa:'', grad:'', lat:null, lng:null, status:'Planiran', postavljen:'', napomena:''}
                   : Object.assign({}, DB.aparati.find(a=>a.oznaka===oznaka));
  if(!rec) return;
  M = {rec, novi, kol:'pn_aparati'};
  otvoriModal(novi?'Novi aparat':rec.oznaka, novi?'Dodavanje u mrežu':(rec.naziv||''), ()=>`
    ${sek('Osnovno')}
    <div class="grp">
      ${polje('machine','#5856d6','Oznaka', inp('oznaka','text','placeholder="VS-002"'))}
      ${polje('building','#007aff','Naziv lokacije', inp('naziv','text','placeholder="GULIVER"'))}
      ${polje('list','#8e8e93','Prostor / kat', inp('prostor'))}
      ${polje('pin','#ff3b30','Adresa', inp('adresa'))}
      ${polje('pin','#ff9500','Grad', inp('grad','text','placeholder="Split"'))}
    </div>
    ${sek('Veza s platformom')}
    <div class="grp">
      ${polje('tag','#af52de','Broj uređaja', inp('uredjaj','text','placeholder="E01498"'), 'kako piše u stupcu Machine Number')}
    </div>
    ${sek('Položaj na karti')}
    <div class="grp">
      ${polje('pin','#34c759','Koordinate', `<input id="koord" placeholder="43.520339, 16.446804" value="${rec.lat!=null?rec.lat+', '+rec.lng:''}">`)}
    </div>
    ${sek('Stanje')}
    <div class="grp">
      ${polje('check','#34c759','Status', sel('status', ['Aktivan','Planiran','Neaktivan']))}
      ${polje('list','#5856d6','Postavljen', inp('postavljen','date'))}
      ${polje('list','#8e8e93','Napomena', inp('napomena'))}
    </div>`, {brisi:!novi});
}

function spremiAparat(){
  const r=M.rec;
  const k=$('#koord')?.value||'';
  if(k.trim()){
    const m=k.match(/(-?\d+[.,]\d+)[^\d-]+(-?\d+[.,]\d+)/);
    if(!m){ poruka('Koordinate nisu prepoznate — očekujem npr. 43.520339, 16.446804','err'); return false; }
    r.lat=parseFloat(m[1].replace(',','.')); r.lng=parseFloat(m[2].replace(',','.'));
    if(r.lat<40||r.lat>49||r.lng<12||r.lng>21){ poruka('Te koordinate nisu u Hrvatskoj — provjerite redoslijed','err'); return false; }
  } else { r.lat=null; r.lng=null; }
  if(!String(r.oznaka||'').trim()){ poruka('Upišite oznaku aparata','err'); return false; }
  if(DB.aparati.some(a=>a.oznaka===r.oznaka && (M.novi || a.oznaka!==M.pocetna))){
    if(M.novi){ poruka('Aparat s tom oznakom već postoji','err'); return false; }
  }
  if(!r.postavljen) delete r.postavljen;
  return r;
}

function otvoriModal(naslov, podnaslov, tijelo, opt={}){
  zatvoriModal();
  M.pocetna = M.rec.oznaka;
  M.tijelo = tijelo;
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.innerHTML=`<div class="modal"><div class="m-head"><div><div class="eyebrow">${esc(podnaslov||'')}</div><h2>${esc(naslov)}</h2></div>
    <button class="x" data-a="close">${ic('x')}</button></div>
    <div class="m-body">${tijelo()}</div>
    <div class="m-foot">${opt.brisi?`<button class="btn dan" data-a="del">${ic('trash')}Obriši</button>`:''}
      <div style="flex:1"></div>
      <button class="btn" data-a="close">Odustani</button>
      <button class="btn pri" data-a="save">${ic('check')}Spremi</button></div></div>`;
  ov.addEventListener('input', e=>{ const b=e.target.closest('[data-b]'); if(b) M.rec[b.dataset.b]=b.value; });
  ov.addEventListener('change', e=>{ const b=e.target.closest('[data-b]'); if(b) M.rec[b.dataset.b]=b.value; });
  ov.addEventListener('click', async e=>{
    if(e.target===ov || e.target.closest('[data-a="close"]')) return zatvoriModal();
    if(e.target.closest('[data-a="save"]')) return spremiModal();
    if(e.target.closest('[data-a="del"]')) return obrisiModal();
  });
  document.body.appendChild(ov);
}
function zatvoriModal(){ $('#ov')?.remove(); }

async function spremiModal(){
  if(M && M.dan) return spremiDan();
  const r = spremiAparat(); if(!r) return;
  try{

      await sb('pn_aparati', {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify([tijelo])});

      await sb('pn_aparati?oznaka=eq.'+encodeURIComponent(M.pocetna), {method:'PATCH', headers:{Prefer:'return=minimal'},

function izvozRedci(){
  const st = poAparatu(), uk = ukupno(), dana = perDana();
  const red = [];
  red.push(['Perla Notte · Pregled prodaje']);
  red.push(['Razdoblje', perNaziv()]);
  red.push(['Izrađeno', new Date().toLocaleString('hr-HR')]);
  if(ODABG) red.push(['Filtar – grad', ODABG]);
  if(ODABA) red.push(['Filtar – aparat', ODABA]);
  red.push([]);
  red.push(['UKUPNO']);
  red.push(['Promet (EUR)', +uk.iznos.toFixed(2)]);
  red.push(['Napitaka', uk.komada]);
  red.push(['Po napitku (EUR)', uk.komada ? +(uk.iznos/uk.komada).toFixed(2) : '']);
  red.push(['Po danu (EUR)', +(uk.iznos/dana).toFixed(2)]);
  red.push([]);
  red.push(['PO LOKACIJAMA']);
  red.push(['Oznaka','Lokacija','Grad','Promet (EUR)','Napitaka','Po danu (EUR)','Udio (%)']);
  DB.aparati.filter(a=>!ODABG || a.grad===ODABG)
    .map(a=>({a, ...(st[a.oznaka]||{iznos:0,komada:0})}))
    .sort((x,y)=>y.iznos-x.iznos)
    .forEach(x=>red.push([x.a.oznaka, x.a.naziv||'', x.a.grad||'',
      +x.iznos.toFixed(2), x.komada, +(x.iznos/dana).toFixed(2),
      uk.iznos ? +(100*x.iznos/uk.iznos).toFixed(1) : 0]));
  red.push([]);
  red.push(['PO OKUSIMA']);
  red.push(['Okus','Napitaka','Promet (EUR)','Po komadu (EUR)','Udio (%)']);
  poProizvodu().forEach(p=>red.push([p.proizvod, p.komada, +p.iznos.toFixed(2),
    p.komada ? +(p.iznos/p.komada).toFixed(2) : '',
    uk.iznos ? +(100*p.iznos/uk.iznos).toFixed(1) : 0]));
  return red;
}
function izvozCsv(){
  const csv = izvozRedci().map(r=>r.map(c=>{
    const t = c==null ? '' : String(c);
    return /[";\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
  }).join(';')).join('\r\n');
  const b = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'Prodaja_'+perOznaka()+'.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  poruka('CSV preuzet');
}
function izvozXlsx(){
  saveXlsx('Pregled prodaje', 'Prodaja_'+perOznaka()+'.xlsx', izvozRedci());
  poruka('Excel preuzet');
}
function izvozPdf(){
  const st = poAparatu(), uk = ukupno(), dana = perDana(), G = grupeGradova(st);
  const P = poProizvodu();
  const p = DB.postavke || {};
  const lok = DB.aparati.filter(a=>!ODABG || a.grad===ODABG)
    .map(a=>({a, ...(st[a.oznaka]||{iznos:0,komada:0})})).sort((x,y)=>y.iznos-x.iznos);
  const tbl = (gl, red) => `<table class="pt"><thead><tr>${gl.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${red.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="d"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const el = document.createElement('div'); el.id='ispis';
  el.innerHTML = `
    <div class="pz">
      <div><div class="pn">${esc(p.naziv||'Perla Notte')}</div>
        <div class="pm">${esc([p.adresa, p.oib?('OIB '+p.oib):''].filter(Boolean).join(' · '))}</div></div>
      <div class="pd">Izrađeno ${new Date().toLocaleString('hr-HR')}</div>
    </div>
    <h1>Pregled prodaje</h1>
    <div class="pm">${esc(perNaziv())}${ODABG?' · '+esc(ODABG):''}${ODABA?' · '+esc(ODABA):''}</div>
    <div class="pk">
      <div><span>Promet</span><b>${eur2(uk.iznos)}</b></div>
      <div><span>Napitaka</span><b>${brj(uk.komada)}</b></div>
      <div><span>Po napitku</span><b>${uk.komada?eur2(uk.iznos/uk.komada):'—'}</b></div>
      <div><span>Po danu</span><b>${eur2(uk.iznos/dana)}</b></div>
    </div>
    <h2>Po gradovima</h2>
    ${tbl(['Grad','Aparata','Napitaka','Promet','Udio'],
      G.map(g=>[esc(g.ime), g.lista.length, brj(g.komada), eur2(g.iznos),
        pst(uk.iznos?100*g.iznos/uk.iznos:0)+' %']))}
    <h2>Po lokacijama</h2>
    ${tbl(['Oznaka','Lokacija','Grad','Napitaka','Promet','Po danu'],
      lok.map(x=>[esc(x.a.oznaka), esc(x.a.naziv||''), esc(x.a.grad||''),
        brj(x.komada), eur2(x.iznos), eur2(x.iznos/dana)]))}
    <h2>Po okusima</h2>
    ${tbl(['Okus','Napitaka','Promet','Po komadu','Udio'],
      P.map(x=>[esc(x.proizvod), brj(x.komada), eur2(x.iznos),
        x.komada?eur2(x.iznos/x.komada):'—',
        pst(uk.iznos?100*x.iznos/uk.iznos:0)+' %']))}
    <div class="pf">Perla Notte · Prodaja ${APP_VER}</div>`;
  $('#ispis')?.remove();
  document.body.appendChild(el);
  setTimeout(()=>{ window.print(); setTimeout(()=>el.remove(), 800); }, 60);
}

/* =========================================================
   ISPRAVAK I BRISANJE
   ========================================================= */
async function obrisiUvoz(id){
  const u = DB.uvoz.find(x=>x.id===id); if(!u) return;
  const moji = DB.prodaja.filter(r=>r.uvoz_id===id);
  if(!await pitaj('Brisanje uvoza',
      `Obrisati uvoz ${u.od===u.do_dat?fDate(u.od):fDate(u.od)+' – '+fDate(u.do_dat)} `
      + `i svih ${moji.length} ${mn(moji.length,'redak','retka','redaka')} prodaje iz njega?`, 'Obriši')) return;
  try{
    await sb('pn_prodaja?uvoz_id=eq.'+encodeURIComponent(id), {method:'DELETE', headers:{Prefer:'return=minimal'}});
    await sb('pn_uvoz?id=eq.'+encodeURIComponent(id), {method:'DELETE', headers:{Prefer:'return=minimal'}});
    await ucitaj(true); poruka('Uvoz obrisan');
  }catch(e){ poruka(e.message||'Nije obrisano','err'); }
}

async function obrisiDan(d){
  const red = dnevni().filter(r=>r.datum===d);
  if(!await pitaj('Brisanje dana',
      `Obrisati svu prodaju za ${fDateLong(d)}? To je ${red.length} ${mn(red.length,'redak','retka','redaka')}.`, 'Obriši')) return;
  try{
    await sb('pn_prodaja?datum=eq.'+d+'&razdoblje=is.false', {method:'DELETE', headers:{Prefer:'return=minimal'}});
    await ucitaj(true); poruka('Dan obrisan');
  }catch(e){ poruka(e.message||'Nije obrisano','err'); }
}

/* ispravak jednog dana — mijenjanje količina, iznosa i brisanje pojedinih okusa */
function urediDan(d){
  const red = DB.prodaja.filter(r=>r.datum===d)
    .map(r=>({id:r.id, oznaka:r.oznaka, proizvod:r.proizvod,
              komada:+r.komada||0, iznos:num(r.iznos), razdoblje:!!r.razdoblje}));
  if(!red.length) return;
  M = {rec:{datum:d, red}, dan:true};
  otvoriModal(fDateLong(d), 'Ispravak prodaje', ()=>{
    const r = M.rec;
    const uk = r.red.filter(x=>!x.brisi).reduce((s,x)=>({k:s.k+(+x.komada||0), i:s.i+num(x.iznos)}), {k:0,i:0});
    return sek('Stavke')+`<div class="grp dan-grp">
      ${r.red.map((x,i)=>`<div class="dan-red${x.brisi?' brisan':''}">
        <div class="dan-n"><b>${esc(x.proizvod)}</b><span>${esc(x.oznaka||'')}</span></div>
        <input class="dan-k" type="number" min="0" step="1" value="${x.komada}" data-i="${i}" data-p="komada" title="Komada">
        <input class="dan-i" type="text" inputmode="decimal" value="${x.iznos.toFixed(2).replace('.',',')}" data-i="${i}" data-p="iznos" title="Iznos u eurima">
        <button type="button" class="btn sm ${x.brisi?'':'dan'}" data-rm="${i}"
          title="${x.brisi?'Vrati':'Ukloni'}">${ic(x.brisi?'refresh':'trash')}</button></div>`).join('')}
    </div>
    <div class="dan-uk"><span>Ukupno nakon ispravka</span>
      <b>${brj(uk.k)} kom · ${eur2(uk.i)}</b></div>
    <div class="napomena" style="margin-top:14px">${ic('file')}<div>
      Mijenjate samo zapis u ovoj aplikaciji. Izvoz s platforme ostaje kakav jest,
      pa pri sljedećem uvozu istog dana ispravak biva zamijenjen izvornim brojkama.</div></div>`;
  }, {});
  const tijelo = $('#ov .m-body');
  tijelo.addEventListener('input', e=>{
    const el = e.target.closest('[data-p]'); if(!el) return;
    const x = M.rec.red[+el.dataset.i];
    x[el.dataset.p] = el.dataset.p==='komada' ? Math.max(0, +el.value||0) : Math.max(0, num(el.value));
    osvjeziZbroj();
  });
  tijelo.addEventListener('click', e=>{
    const b = e.target.closest('[data-rm]'); if(!b) return;
    const x = M.rec.red[+b.dataset.rm];
    x.brisi = !x.brisi;
    $('#ov .m-body').innerHTML = M.tijelo();
  });
}
function osvjeziZbroj(){
  const el = $('.dan-uk b'); if(!el || !M || !M.dan) return;
  const uk = M.rec.red.filter(x=>!x.brisi).reduce((s,x)=>({k:s.k+(+x.komada||0), i:s.i+num(x.iznos)}), {k:0,i:0});
  el.textContent = brj(uk.k)+' kom · '+eur2(uk.i);
}
async function spremiDan(){
  const r = M.rec;
  try{
    for(const x of r.red){
      if(x.brisi){ await sb('pn_prodaja?id=eq.'+encodeURIComponent(x.id), {method:'DELETE', headers:{Prefer:'return=minimal'}}); }
      else await sb('pn_prodaja?id=eq.'+encodeURIComponent(x.id), {method:'PATCH', headers:{Prefer:'return=minimal'},
        body:JSON.stringify({komada:+x.komada||0, iznos:+num(x.iznos).toFixed(2), updated_at:new Date().toISOString()})});
    }
    zatvoriModal(); await ucitaj(true); poruka('Ispravljeno');
  }catch(e){ poruka(e.message||'Nije spremljeno','err'); }
}
